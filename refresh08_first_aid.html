<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>רענון 08 – פציעה משמעותית וטראומה</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef7ff,#f8f3ff);color:#243246;line-height:1.65}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 8px 28px rgba(40,60,90,.12)}h1{color:#234f78;margin-top:0}h2{color:#6a3f87}.badge{display:inline-block;background:#e7f3ff;color:#245b87;padding:6px 12px;border-radius:20px;font-weight:bold}.scenario{background:#f5f9ff;border-right:6px solid #5b8def;padding:16px;border-radius:14px;margin:18px 0}.question{font-size:1.12rem;font-weight:bold;margin:20px 0 12px}button{width:100%;border:0;border-radius:14px;padding:14px 16px;margin:7px 0;font-size:1rem;cursor:pointer;background:#edf3ff;color:#24364d;text-align:right}button:hover{background:#dfeaff}.start,.next{text-align:center;background:#3478c8;color:white;font-weight:bold}.correct{background:#dff5df!important;border:2px solid #49a64b;color:#174d1b}.wrong{background:#ffe1e1!important;border:2px solid #d45b5b;color:#6b1717}.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;font-weight:bold}.feedback.ok{background:#e6f7e7;color:#205b26}.feedback.no{background:#ffe9e9;color:#7a1d1d}.progress{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:14px 0 20px}.bar{height:100%;background:#5b8def;width:0;transition:.25s}.hidden{display:none}.score{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.score span{padding:8px 14px;border-radius:18px;font-weight:bold}.good{background:#ddf3df;color:#24652a}.bad{background:#ffe0e0;color:#7a2222}.takeaway{background:#fff7dc;border-right:5px solid #e0ad36;padding:14px;border-radius:12px;margin:10px 0}small{color:#65758a}
</style></head><body><div class="wrap">
<section id="intro" class="card"><span class="badge">רענון 08</span><h1>פציעה משמעותית וטראומה</h1><p>שני אירועים נפרדים. בכל אחד מהם תתקדם בתוך הסיפור ותצטרך לקבל החלטות. המטרה היא לזהות סימנים משמעותיים, לשמור על בטיחות ולדעת מתי ואיך להזעיק עזרה.</p><p><strong>אם טעית:</strong> האירוע ממשיך. תקבל מיד משוב, והתשובה הנכונה תסומן בירוק.</p><button class="start" onclick="start()">התחל רענון</button></section>
<section id="game" class="card hidden"><div id="eventTitle"></div><div class="progress"><div id="bar" class="bar"></div></div><div id="story" class="scenario"></div><div id="question" class="question"></div><div id="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="next hidden" onclick="nextStep()">המשך</button></section><section id="summary" class="card hidden"></section></div>
<script>
const events=[
{title:'אירוע 1 – פגיעת ראש',story:['אתה עובר ליד מחסן הציוד. פתאום אתה שומע רעש חזק של נפילה.','כשאתה מגיע, אתה רואה את אורי על הרצפה ליד סולם שהתהפך. כנראה שהוא עמד על הסולם ונפל ממנו. יש לו חבורה ונפיחות במצח, והוא מתלונן על כאב ראש. הוא בהכרה, אבל נראה מבולבל מעט. הוא אומר: ״אני בסדר... רק תן לי רגע.״'],qs:[
{q:'מה הדבר החשוב ביותר לעשות עכשיו?',a:['לעזור לאורי מיד לקום ולשבת על כיסא, כדי שלא יישאר על הרצפה.','לבדוק את מצבו, להימנע מתנועה מיותרת ולהזעיק עזרה בהתאם למצב.','לתת לו מים ולהמתין כמה דקות כדי לראות אם כאב הראש והבלבול עוברים.','לשאול אותו אם הוא זוכר בדיוק איך נפל; אם כן, כנראה שאין צורך לעשות דבר נוסף.'],correct:1},
{q:'אורי עדיין על הרצפה. אתה מבקש ממנו להישאר במקום ומזעיק עזרה. הוא אומר: ״קצת יותר טוב עכשיו... אבל הראש שלי ממש כואב.״ אתה שם לב שהתשובות שלו איטיות מהרגיל. מה נכון לעשות?',a:['להשאיר אותו במקומו, להימנע מתנועה מיותרת ולעקוב אחר מצבו עד לקבלת הנחיות או הגעת הצוות הרפואי.','מכיוון שהוא בהכרה ומגיב, לעזור לו לקום וללכת למקום נוח יותר.','לתת לו משכך כאבים ולבדוק בעוד חצי שעה אם חל שיפור.','לתת לו לשתות מים ולבקש ממנו לנוח בשכיבה.'],correct:0},
{q:'אורי אומר: ״תגיד... מה קרה? אני לא ממש זוכר איך נפלתי.״ הוא עדיין ער ומגיב, אבל נראה מבולבל. מה נכון לעשות?',a:['להסביר לו בדיוק מה קרה, ולבקש ממנו לקום כדי לבדוק אם הוא מסוגל ללכת.','לתת לו משהו לאכול כדי לראות אם הוא חוזר לעצמו.','להשאיר אותו במנוחה, להמשיך לעקוב אחר מצבו ולדווח לגורם הרפואי על הבלבול ועל כך שאינו זוכר את האירוע.','לומר לו שאין מה לדאוג, כי הוא בהכרה ומדבר.'],correct:2},
{q:'כעבור זמן קצר אתה שם לב שאורי נעשה ישנוני יותר, וכשאתה שואל אותו שאלה פשוטה לוקח לו זמן לענות. מה הדבר הנכון לעשות עכשיו?',a:['לתת לו לישון, כי הוא אמר שהוא מרגיש יותר טוב.','לעזור לו לשבת כדי שיהיה לו נוח יותר ולהמשיך להמתין.','לתת לו לשתות משהו מתוק כדי לעזור לו להתעורר.','להמשיך לעקוב אחר מצבו, לבדוק את התגובה והנשימה, ולעדכן מיד את מוקד החירום שהמצב השתנה.'],correct:3}]},
{title:'אירוע 2 – תאונה עם רכבון',story:['אתה נמצא בחצר התפעול. אחד העובדים נוסע ברכבון תפעולי קטן. לפתע אתה שומע חריקת בלמים ורעש חזק של התהפכות.','כשאתה מגיע למקום, אתה רואה את הרכבון על צדו. מתחת לחלק הקדמי נמצא עובד אחר, לכוד ומתקשה לזוז. הוא בהכרה וצועק: ״כואב לי! תוציאו אותי מפה!״'],qs:[
{q:'מה הדבר החשוב ביותר לעשות עכשיו?',a:['לגשת מיד ולנסות למשוך אותו החוצה.','לבקש מכמה עובדים נוספים להרים את הרכבון בידיים כדי לשחרר אותו.','לנסות להרגיע אותו ככל האפשר, לבדוק אם יש סכנה מיידית בזירה ולהזעיק עזרה מקצועית.','לתת לו מים ולהרגיע אותו עד שהכאב יחלוף.'],correct:2},
{q:'אתה מתקרב רק עד למקום שבו אתה בטוח. אתה מנסה להרגיע את העובד ככל האפשר ומזעיק עזרה. הוא אומר: ״אני לא מצליח להזיז את הרגל... בבקשה תוציא אותי.״ מה נכון לעשות?',a:['לא לנסות להזיז את הרכבון או את העובד בכוח; להרחיק אנשים מהאזור ולהמתין לחילוץ מקצועי, אלא אם קיימת סכנה מיידית שמחייבת פעולה אחרת.','לנסות למשוך את העובד החוצה, אפילו אם הוא לכוד חלקית.','לבקש מכמה עובדים נוספים להרים את הרכבון בידיים כדי לשחרר אותו.','להשכיב את העובד על גבו ולבדוק אם הוא יכול לקום בעצמו.'],correct:0},
{q:'העובד עדיין לכוד. אתה מדווח למוקד החירום שהעובד נמצא מתחת לרכבון. כעבור רגע הוא אומר: ״אני מרגיש חולשה... אני קצת מתקשה לנשום.״ מה נכון לעשות עכשיו?',a:['לבקש ממנו לנסות להשתחרר בעצמו.','להמשיך לדבר איתו, לעקוב אחר ההכרה והנשימה ולעדכן מיד את מוקד החירום שהמצב השתנה.','לנסות להרים את הרכבון במהירות כדי לאפשר לו לנשום טוב יותר.','להשאיר אותו לבד לכמה דקות כדי שלא יילחץ.'],correct:1}]}
];
let ev=0,qi=0,correct=0,wrong=0;
function start(){intro.classList.add('hidden');game.classList.remove('hidden');ev=0;qi=0;correct=0;wrong=0;render()}
function render(){let E=events[ev],Q=E.qs[qi];eventTitle.innerHTML='<h2>'+E.title+'</h2>';story.textContent=E.story[Math.min(qi,E.story.length-1)];question.textContent=Q.q;answers.innerHTML='';feedback.style.display='none';next.classList.add('hidden');['א','ב','ג','ד'].forEach((l,i)=>{let b=document.createElement('button');b.innerHTML='<strong>'+l+'.</strong> '+Q.a[i];b.onclick=()=>answer(i);answers.appendChild(b)});let total=events.reduce((n,e)=>n+e.qs.length,0),done=events.slice(0,ev).reduce((n,e)=>n+e.qs.length,0)+qi;bar.style.width=done/total*100+'%'}
function answer(i){let Q=events[ev].qs[qi],bs=[...answers.querySelectorAll('button')];bs.forEach(b=>b.disabled=true);bs[Q.correct].classList.add('correct');if(i===Q.correct){correct++;bs[i].classList.add('correct');feedback.className='feedback ok';feedback.innerHTML='✔️ נכון'}else{wrong++;bs[i].classList.add('wrong');feedback.className='feedback no';feedback.innerHTML='❌ לא נכון<br><span>התשובה הנכונה מסומנת בירוק.</span>'}feedback.style.display='block';next.classList.remove('hidden');next.textContent=qi<E.qs.length-1?'המשך':ev<events.length-1?'סיום האירוע והמשך לאירוע הבא':'סיום הרענון'}
function nextStep(){if(qi<events[ev].qs.length-1){qi++;render();return}showClosure()}
function showClosure(){story.textContent='הצוות המקצועי מגיע ולוקח אחריות על האירוע. אתה מוסר את המידע שצברת במהלך האירוע.';question.textContent='';answers.innerHTML='';feedback.style.display='none';next.classList.remove('hidden');next.textContent=ev<events.length-1?'המשך לאירוע הבא':'סיום הרענון';next.onclick=()=>{if(ev<events.length-1){ev++;qi=0;next.onclick=nextStep;render()}else finish()}}
function finish(){game.classList.add('hidden');summary.classList.remove('hidden');summary.innerHTML='<span class="badge">סיכום</span><h1>הרענון הסתיים</h1><div class="score"><span class="good">✔️ תשובות נכונות: '+correct+'</span><span class="bad">❌ תשובות שגויות: '+wrong+'</span></div><h2>מה חשוב לזכור</h2><div class="takeaway"><strong>פגיעת ראש:</strong> נפילה עם חבלת ראש, בלבול או שינוי בזיכרון דורשים התייחסות רצינית ומעקב. לא ממהרים להעמיד את הנפגע.</div><div class="takeaway"><strong>שינוי במצב:</strong> אם לאחר חבלת ראש האדם נעשה ישנוני יותר או קשה יותר לקבל ממנו תגובה, מעדכנים מיד את מוקד החירום ועוקבים אחר ההכרה והנשימה.</div><div class="takeaway"><strong>תאונה עם רכבון:</strong> קודם כול בטיחות הזירה. לא מבצעים חילוץ מאולתר ולא מזיזים את הרכבון או את הנפגע בכוח.</div><div class="takeaway"><strong>החמרה במצב:</strong> נשארים עם הנפגע, מנסים להרגיע אותו ככל האפשר, עוקבים אחר מצבו ומעדכנים מיד את מוקד החירום כאשר חל שינוי.</div><p><small>הרענון אינו מחליף הכשרת עזרה ראשונה, נהלי מקום העבודה או הנחיות גורמי החירום והרפואה.</small></p><a class="home" href="index.html">🏠 חזרה לתפריט הראשי</a>'}
</script></body></html>
