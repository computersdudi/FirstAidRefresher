<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>רענון 07 – הכשת נחש והרעלה</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef7ff,#f8f3ff);color:#233044;line-height:1.65}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 8px 28px #283c5a1f}h1{color:#234f78}h2{color:#6a3f87}.badge{display:inline-block;background:#e7f3ff;color:#245b87;padding:6px 12px;border-radius:20px;font-weight:bold}.scenario{background:#f5f9ff;border-right:6px solid #5b8def;padding:16px;border-radius:14px;margin:18px 0}.question{font-size:1.12rem;font-weight:bold;margin:20px 0 12px}button{width:100%;border:0;border-radius:14px;padding:14px 16px;margin:7px 0;font-size:1rem;cursor:pointer;background:#edf3ff;color:#24364d;text-align:right}button:hover{background:#dfeaff}.start,.next{text-align:center;background:#3478c8;color:white;font-weight:bold}.correct{background:#dff5df!important;border:2px solid #49a64b;color:#174d1b}.wrong{background:#ffe1e1!important;border:2px solid #d45b5b;color:#6b1717}.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;font-weight:bold}.ok{background:#e6f7e7;color:#205b26}.no{background:#ffe9e9;color:#7a1d1d}.progress{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:14px 0 20px}.bar{height:100%;background:#5b8def;width:0;transition:.25s}.hidden{display:none}.score{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.score span{padding:8px 14px;border-radius:18px;font-weight:bold}.good{background:#ddf3df;color:#24652a}.bad{background:#ffe0e0;color:#7a2222}.takeaway{background:#fff7dc;border-right:5px solid #e0ad36;padding:14px;border-radius:12px;margin:10px 0}small{color:#65758a}</style></head><body><div class="wrap">
<section id="intro" class="card"><span class="badge">רענון 07</span><h1>הכשת נחש והרעלה</h1><p>שני אירועים נפרדים. בכל אחד מהם תתקדם בתוך הסיפור ותצטרך לקבל החלטות. אין צורך לאבחן את המצב. המטרה היא לזהות מצב חירום, לפעול נכון ולהזעיק עזרה.</p><p><strong>אם טעית:</strong> האירוע ממשיך. תקבל מיד משוב, והתשובה הנכונה תסומן בירוק.</p><button class="start" onclick="start()">התחל רענון</button></section>
<section id="game" class="card hidden"><div id="eventTitle"></div><div class="progress"><div id="bar" class="bar"></div></div><div id="story" class="scenario"></div><div id="question" class="question"></div><div id="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="next hidden" onclick="nextStep()">המשך</button></section><section id="summary" class="card hidden"></section></div>
<script>
const events=[{title:'אירוע 1 – הכשת נחש',story:['אתם נמצאים בחוץ. לפתע מישהו צועק: ״היה פה נחש!״','אלכס יושב בצד הדרך, מפוחד, מחזיק בכף הרגל ואומר: ״נראה לי שהוא הכיש אותי.״ הנחש כבר לא נראה.'],qs:[{q:'מה הדבר החשוב ביותר לעשות עכשיו?',a:['לנסות למצוא את הנחש כדי לזהות אותו','להתקשר למד״א ולהרגיע את אלכס, תוך פעולה לפי ההנחיות שיינתנו','לשטוף את מקום ההכשה ולהניח עליו קרח','לקשור חוסם עורקים מעל מקום ההכשה'],correct:1},{q:'אלכס רוצה לקום וללכת לכיוון המקום שבו נמצא הרכב. מה נכון לעשות?',a:['לתת לו ללכת לאט, כדי שלא יילחץ','לבקש ממנו להישאר רגוע ולנוע כמה שפחות, ולהמתין להנחיות מד״א','לעסות את הרגל כדי לשפר את זרימת הדם','להגביה את הרגל מעל גובה הלב'],correct:1},{q:'אתה מבחין בשעון הדוק על היד של אלכס. מה נכון לעשות?',a:['להשאיר אותו בכל מקרה כדי לא להזיז את הנפגע','להדק אותו יותר כדי למנוע התפשטות של הארס','אם אפשר בקלות, להסיר פריטים לוחצים כמו שעון או תכשיטים לפני שעלולה להתפתח נפיחות','לשים תחבושת הדוקה סביב כל הרגל'],correct:2},{q:'אלכס שואל מה לעשות עם מקום ההכשה. מה נכון?',a:['להניח קרח ישירות על המקום','לעסות את המקום בעדינות','לא להניח קרח ולא לעסות או לבצע טיפול מקומי; לפעול לפי הנחיות מד״א ולהעביר לצוות הרפואי את המידע הידוע','לחתוך מעט את מקום ההכשה כדי להוציא את הארס'],correct:2}]},{title:'אירוע 2 – שתיית חומר לא ידוע',story:['באירוע אחר, עובד פונה אליך כשהוא נראה מבולבל.','הוא אומר: ״שתיתי קצת... אני לא יודע מה זה היה.״ לידו נמצאת בקבוקית של נוזל שאינו מיועד לשתייה.'],qs:[{q:'מה הדבר הראשון שחשוב לעשות?',a:['לתת לו הרבה מים כדי לדלל את החומר','לגרום לו להקיא כדי להוציא את החומר','להזעיק עזרה רפואית/מוקד מתאים, לשמור את הבקבוק או האריזה לזיהוי ולפעול לפי ההנחיות שיינתנו','לתת לו אוכל כדי שהחומר ייספג פחות'],correct:2},{q:'העובד מבקש לשתות משהו. מה נכון לעשות?',a:['לתת מים בכמות קטנה','לא לתת דבר דרך הפה, אלא אם גורם רפואי/מוקד חירום מנחה במפורש לעשות זאת','לתת חלב','לתת משקה מתוק'],correct:1},{q:'אתה לא בטוח מה יש בבקבוק. מה נכון לעשות?',a:['לפתוח ולהריח כדי לנסות לזהות את החומר','להשאיר את הבקבוק כפי שהוא, ולא לפתוח, להריח או לטעום; למסור את המידע לצוות הרפואי/למוקד החירום','לשפוך מעט לכוס כדי לבדוק את הצבע','לנסות לזהות את החומר לפי הריח'],correct:1},{q:'העובד אומר: ״אני מתחיל להרגיש יותר רע.״ הוא נעשה ישנוני וקשה יותר לענות לו. מה עכשיו?',a:['להשאיר אותו לבד כדי שינוח','לתת לו מים ולחכות לראות אם יעבור','לבדוק את מצבו ואת הנשימה, לעדכן מיד את מוקד החירום ולפעול לפי ההנחיות','לגרום לו ללכת כדי להישאר ער'],correct:2}]}];
let ev=0,qi=0,correct=0,wrong=0;function start(){intro.classList.add('hidden');game.classList.remove('hidden');ev=qi=correct=wrong=0;render()}function render(){let E=events[ev],Q=E.qs[qi];eventTitle.innerHTML='<h2>'+E.title+'</h2>';story.textContent=E.story[qi]||E.story[E.story.length-1];question.textContent=Q.q;answers.innerHTML='';feedback.style.display='none';next.classList.add('hidden');['א','ב','ג','ד'].forEach((l,i)=>{let b=document.createElement('button');b.innerHTML='<strong>'+l+'.</strong> '+Q.a[i];b.onclick=()=>answer(i);answers.appendChild(b)});let total=events.reduce((n,e)=>n+e.qs.length,0),done=events.slice(0,ev).reduce((n,e)=>n+e.qs.length,0)+qi;bar.style.width=done/total*100+'%'}function answer(i){let Q=events[ev].qs[qi],bs=[...answers.children];bs.forEach(b=>b.disabled=true);bs[Q.correct].classList.add('correct');if(i===Q.correct){correct++;feedback.className='feedback ok';feedback.innerHTML='✔️ נכון'}else{wrong++;bs[i].classList.add('wrong');feedback.className='feedback no';feedback.innerHTML='❌ לא נכון<br><span>התשובה הנכונה מסומנת בירוק.</span>'}feedback.style.display='block';next.classList.remove('hidden');next.textContent=qi<events[ev].qs.length-1?'המשך':ev<events.length-1?'סיום האירוע והמשך לאירוע הבא':'סיום הרענון'}function nextStep(){if(qi<events[ev].qs.length-1){qi++;render();return}showClosure()}function showClosure(){story.textContent='הצוות הרפואי מגיע ולוקח אחריות על האירוע. אתה מוסר את המידע שצברת במהלך האירוע.';question.textContent='';answers.innerHTML='';feedback.style.display='none';next.classList.remove('hidden');next.textContent=ev<events.length-1?'המשך לאירוע הבא':'סיום הרענון';next.onclick=()=>{if(ev<events.length-1){ev++;qi=0;next.onclick=nextStep;render()}else finish()}}function finish(){game.classList.add('hidden');summary.classList.remove('hidden');summary.innerHTML='<span class="badge">סיכום</span><h1>הרענון הסתיים</h1><div class="score"><span class="good">✔️ תשובות נכונות: '+correct+'</span><span class="bad">❌ תשובות שגויות: '+wrong+'</span></div><h2>מה חשוב לזכור</h2><div class="takeaway"><strong>הכשת נחש:</strong> להזעיק עזרה רפואית, להרגיע ולשמור על הנפגע רגוע וכמה שיותר ללא תנועה. אם אפשר בקלות, להסיר פריטים לוחצים לפני נפיחות.</div><div class="takeaway"><strong>מה לא לעשות בהכשה:</strong> לא לשים קרח, לא לעסות, לא להשתמש בחוסם עורקים ולא להסתכן בניסיון ללכוד או לזהות את הנחש.</div><div class="takeaway"><strong>חומר לא ידוע:</strong> להזעיק עזרה, לשמור את הבקבוק/האריזה לזיהוי, ולא לגרום להקאה או לתת אוכל/שתייה על דעת עצמך.</div><div class="takeaway"><strong>החמרה במצב:</strong> אם האדם נעשה ישנוני או קשה יותר לענות לו, לבדוק מצב ונשימה, לעדכן מיד את מוקד החירום ולפעול לפי ההנחיות.</div><p><small>הרענון אינו מחליף הכשרת עזרה ראשונה, נהלי מקום העבודה או הנחיות גורמי החירום והרפואה.</small></p><a class="home" href="index.html">🏠 חזרה לתפריט הראשי</a>'}</script></body></html>
