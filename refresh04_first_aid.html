<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>רענון 04 — מצב רפואי פתאומי</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#202124;line-height:1.65}
.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:white;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 2px 10px #0001}
h1{margin-top:0;color:#173b57} h2{color:#245b7a}
.choice{display:block;width:100%;text-align:right;padding:14px;margin:10px 0;border:1px solid #ccd5dc;border-radius:12px;background:#fff;font-size:16px;cursor:pointer}
.choice:hover{background:#f1f6fa}
.correct{background:#e7f6e9!important;border-color:#4caf50!important}
.wrong{background:#fde8e8!important;border-color:#d33!important}
.feedback{padding:14px;border-radius:12px;margin-top:14px;font-weight:600}
.ok{background:#e7f6e9}.bad{background:#fde8e8}
.next{margin-top:14px;padding:12px 20px;border:0;border-radius:10px;background:#245b7a;color:white;font-size:16px;cursor:pointer}
.small{font-size:14px;color:#5f6368}.progress{height:8px;background:#e3e8ec;border-radius:8px;overflow:hidden}.bar{height:100%;background:#245b7a;width:0}
li{margin:8px 0}
</style>
</head>
<body><div class="wrap">
<div class="card"><h1>רענון 04 — מצב רפואי פתאומי</h1>
<p>שני אירועים קצרים. בכל שלב בוחרים מה נכון לעשות. אין צורך לאבחן — המטרה היא לזהות מצב שעלול להיות מסוכן, לפעול בזמן ולהזעיק עזרה.</p>
<div class="progress"><div id="bar" class="bar"></div></div>
<p class="small">המשוב המפורט על טעויות יופיע בסוף.</p></div>
<div id="app"></div></div>
<script>
const introScreen = `
<div class="card">
  <h2>לפני שמתחילים</h2>
  <p>ברענון הזה תפגוש שני מצבים רפואיים פתאומיים.</p>
  <p>בכל אירוע תצטרך לקבל כמה החלטות קצרות, כמו עובד שנמצא במקום האירוע.</p>
  <ul>
    <li>בחר את הפעולה שלדעתך נכונה.</li>
    <li>אם טעית, הרענון ימשיך — ובסוף תקבל הסבר על הטעות.</li>
    <li>המטרה אינה לאבחן, אלא לזהות מצב שעלול להיות מסוכן, לפעול במסגרת ההכשרה ולהזעיק את הגורמים המתאימים.</li>
  </ul>
  <p class="small">משך משוער: כ־10 דקות.</p>
  <button class="next" style="display:block;width:100%;margin-top:22px;" onclick="startRefresh()">התחל את הרענון</button>
</div>`;
const events=[
{title:"אירוע 1 — משהו לא בסדר עם יוסי",intro:`אמצע משמרת הבוקר.<br><br>יוסי יושב בחדר האוכל. אתה עובר לידו והוא קורא לך:<br><br>“רגע... אני לא מרגיש טוב.”<br><br>אתה מתקרב. יוסי מחזיק את החזה ואומר:<br><br>“יש לי לחץ כזה בחזה... וזה לא עובר.”<br><br>הוא בהכרה ומדבר איתך.`,qs:[
{t:"מה הדבר החשוב ביותר לעשות עכשיו?",o:["לבקש ממנו לשכב ולחכות כמה דקות כדי לראות אם זה עובר.","לשאול אותו אם אכל משהו לאחרונה, כי אולי מדובר בבעיה בקיבה.","להתייחס למצב כאל מצב חירום אפשרי ולהזעיק עזרה רפואית.","לתת לו מים ולבדוק אם הוא מרגיש טוב יותר."],a:2,fb:"הסימנים מצדיקים התייחסות למצב חירום אפשרי והפעלת עזרה רפואית."},
{t:"יוסי אומר: “עזוב... אולי זה שום דבר. אולי סתם נתפס לי משהו.” מה נכון לחשוב ולעשות?",o:["אם יוסי עצמו חושב שזה לא רציני, אפשר להמתין ולראות.","כאב בחזה יכול לנבוע מסיבות שונות, אבל הוא עלול להיות סימן למצב חמור, כולל אירוע לבבי — ולכן ממשיכים להתייחס אליו כאל מצב חירום.","לבקש ממנו לקום וללכת כמה צעדים כדי לבדוק אם הכאב קשור לתנועה.","לתת לו משהו לאכול ולבדוק אם הכאב משתפר."],a:1,fb:"לא צריך לאבחן אירוע לבבי. צריך להבין שכאב חזה עלול להיות סימן למצב חמור ולפעול בהתאם."},
{t:"יוסי אומר: “עכשיו אני גם קצת מזיע... וקצת קשה לי לנשום.” מה אתה עושה?",o:["אומר ליוסי לנוח, נשאר איתו ומעדכן את מוקד החירום שהתווספו הזעה וקוצר נשימה.","נותן לו מים ומבקש ממנו לנשום עמוק.","מבקש ממנו ללכת כמה צעדים כדי לראות אם התנועה מחמירה את המצב.","אומר לו שאם הוא עדיין מסוגל לדבר, כנראה שהמצב לא חמור."],a:0,fb:"הופיעו סימני אזהרה נוספים. חשוב להישאר איתו, לעקוב ולעדכן את מוקד החירום על ההחמרה."}
]},
{title:"אירוע 2 — משהו השתנה אצל רונית",intro:`אחר הצהריים, במהלך פעילות רגילה.<br><br>אתה מדבר עם רונית. פתאום אתה שם לב שהיא מדברת בצורה מוזרה.<br><br>אתה שואל: “רונית, הכול בסדר?”<br><br>היא מנסה לענות, אבל המילים יוצאות לא ברור.<br><br>אתה מסתכל עליה ורואה שגם צד אחד של הפנים שלה נראה שונה.`,qs:[
{t:"מה הדבר החשוב ביותר לעשות עכשיו?",o:["לתת לה לשבת ולראות אם הדיבור מסתדר בעוד כמה דקות.","לשאול אותה אם היא עייפה או אם היא לקחה תרופה כלשהי.","לבקש ממנה לשתות מים, אולי היא מיובשת.","להתייחס לזה כאל מצב רפואי חירום אפשרי ולהזעיק עזרה רפואית."],a:3,fb:"שינוי פתאומי בדיבור ובפנים יכול להתאים לשבץ. יש להזעיק עזרה רפואית מיד."},
{t:"העזרה הרפואית כבר הוזעקה. אתה רוצה לבדוק במהירות אם יש סימן נוסף שמתאים לאירוע מוחי. מה אתה עושה?",o:["מבקש מרונית להרים את שתי הידיים ולבדוק אם אחת מהן חלשה או צונחת.","מבקש ממנה ללכת כמה צעדים כדי לבדוק את שיווי המשקל.","נותן לה לשתות מים ולראות אם הדיבור משתפר.","שואל אותה אם היא עייפה היום ואם ישנה מספיק בלילה."],a:0,fb:"בדיקת הידיים היא חלק מ-FAST: Face, Arms, Speech, Time. אין צורך להאריך את הבדיקה או לעכב את העזרה."},
{t:"רונית לא מצליחה לומר מתי זה התחיל. עובדת אחרת אומרת: “דיברתי איתה לפני בערך עשר דקות. אז היא הייתה לגמרי בסדר.” מה חשוב לעשות?",o:["לחכות ולראות אם המצב משתפר לפני שמדווחים.","למסור למוקד החירום את הזמן שבו נראתה לאחרונה כרגיל.","לשאול אם היא אכלה היום כדי לבדוק אם מדובר בירידת סוכר.","לבקש ממנה לנסות ללכת כדי לבדוק אם היא מסוגלת לעמוד."],a:1,fb:"בחשד לשבץ חשוב למסור לצוות הרפואי מתי האדם נראה לאחרונה כרגיל, ככל שניתן לדעת."},
{t:"רונית שואלת: “אני יכולה לשתות קצת מים?” מה אתה עושה?",o:["נותן לה לשתות מעט, אבל לאט.","מבקש ממנה לשתות רק אם היא מרגישה שהיא מסוגלת לבלוע.","לא נותן לה אוכל או שתייה וממשיך לפעול לפי הנחיות מוקד החירום.","נותן לה משהו מתוק, כי ייתכן שמדובר בירידת סוכר."],a:2,fb:"כשיש קושי בדיבור וחשש לבעיית בליעה, לא נותנים אוכל או שתייה באופן שגרתי. ממשיכים לפי הנחיות מוקד החירום."},
{t:"רונית שואלת: “מה קורה לי?” מה נכון לומר ולעשות?",o:["“כנראה שיש לך שבץ, אבל אל תדאגי.”","“אני לא יודע מה הסיבה, אבל ראינו שינוי פתאומי והזעקתי עזרה. אני נשאר איתך עד שהצוות הרפואי יגיע.”","“אם את מצליחה לדבר, כנראה שזה לא שבץ.”","“תנסי לקום וללכת. אם את מצליחה, כנראה שהכול בסדר.”"],a:1,fb:"העובד אינו מאבחן. הוא מסביר מה הוא יודע, מרגיע בלי להבטיח, ונשאר עם האדם עד הגעת הצוות הרפואי."}
]}];

let ei=0,qi=0,correct=0,wrong=0,mistakes=[];
const app=document.getElementById('app'),bar=document.getElementById('bar');
function render(){const e=events[ei],q=e.qs[qi];bar.style.width=((ei*5+qi+1)/8*100)+"%";
app.innerHTML=`<div class="card"><h2>${e.title}</h2><p>${qi===0?e.intro:""}</p><p><b>החלטה ${qi+1}</b><br>${q.t}</p>${q.o.map((x,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(1488+i)}. ${x}</button>`).join("")}<div id="fb"></div></div>`}
function answer(i){const q=events[ei].qs[qi],bs=[...document.querySelectorAll('.choice')];bs.forEach(b=>b.disabled=true);const ok=i===q.a;if(ok)correct++;else{wrong++;mistakes.push({e:ei+1,q:qi+1,fb:q.fb});}bs[i].classList.add(ok?"correct":"wrong");if(!ok)bs[q.a].classList.add("correct");const f=document.getElementById('fb');f.className="feedback "+(ok?"ok":"bad");f.innerHTML=(ok
  ?"✔️ נכון"
  :`❌ לא נכון<br><span class="small">התשובה הנכונה מסומנת בירוק.</span>`
)+`<br><button class="next" onclick="next()">המשך</button>`}
function next(){
  qi++;
  if(qi>=events[ei].qs.length){
    const finishedEvent = ei;
    ei++;
    qi=0;
    if(ei>=events.length){finish();return;}
    showEventEnd(finishedEvent);
    return;
  }
  render();
}
function showEventEnd(finishedEvent){
  const text = finishedEvent===0
    ? "יוסי הועבר להמשך טיפול בידי הצוות הרפואי. האירוע הראשון הסתיים."
    : "רונית הועברה להמשך טיפול בידי הצוות הרפואי. האירוע השני הסתיים.";
  app.innerHTML=`<div class="card">
    <h2>סיום האירוע הראשון</h2>
    <p>${text}</p>
    <p>בשלב הזה אין צורך להמשיך לקבל החלטות. נעבור עכשיו למקרה הבא.</p>
    <button class="next" onclick="render()">המשך לאירוע הבא</button>
  </div>`;
}
function finish(){bar.style.width="100%";app.innerHTML=`<div class="card"><h2>סיום הרענון</h2><p>היו לך <b>${correct}</b> החלטות נכונות ו־<b>${wrong}</b> החלטות שדרשו תיקון.</p>${mistakes.length?`<h3>מה כדאי לזכור מהטעויות</h3><ul>${mistakes.map(m=>`<li><b>אירוע ${m.e}, החלטה ${m.q}:</b> ${m.fb}</li>`).join("")}</ul>`:"<p>כל ההחלטות היו נכונות.</p>"}<h3>שלושה דברים לקחת מהתרגול</h3><ul><li><b>כאב בחזה:</b> לא צריך לקבוע מה האבחנה. כאב או לחץ בחזה, במיוחד עם הזעה או קוצר נשימה, עלולים להתאים גם לאירוע לבבי ולכן מצדיקים הזעקת עזרה רפואית.</li><li><b>חשד לשבץ:</b> שינוי פתאומי בפנים, ביד או בדיבור מצדיק פעולה מהירה. חשוב למסור גם מתי האדם נראה לאחרונה כרגיל.</li><li><b>התפקיד של העובד:</b> לזהות מצב שעלול להיות מסוכן, לפעול במסגרת ההכשרה, להזעיק עזרה ולהעביר מידע — לא לאבחן.</li></ul><p class="small">רענון זה הוא כלי חזרה והטמעה בלבד ואינו מחליף הכשרה מקצועית, נהלי מקום העבודה או הנחיות גורמי החירום.</p><a class="home" href="index.html">🏠 חזרה לתפריט הראשי</a></div>`}
function startRefresh(){ render(); }
app.innerHTML=introScreen;
</script></body></html>
